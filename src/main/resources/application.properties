spring.application.name=sweet-bel-erina
server.port=${PORT:3000}
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=SWEET_BELERINA_SESSION
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sweetbel;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=never

app.oauth.google-id=${GOOGLE_CLIENT_ID:}
app.oauth.google-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.facebook-id=${FACEBOOK_APP_ID:}
app.oauth.facebook-secret=${FACEBOOK_APP_SECRET:}
app.owner.email=${STORE_OWNER_EMAIL:}
app.maps.api-url=${MANUS_API_URL:}
app.maps.browser-key=${MANUS_API_BROWSER_KEY:}
app.maps.server-key=${MANUS_API_KEY:}
app.db.ssl-mode=${DB_SSL_MODE:VERIFY_IDENTITY}

logging.level.root=INFO
logging.level.com.sweetbelerina=INFO
